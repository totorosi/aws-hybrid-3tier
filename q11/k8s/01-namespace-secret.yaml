# EKS 계층 - 네임스페이스
#
# DB 자격증명은 02-external-secret.yaml 에서 External Secrets Operator 가
# Secrets Manager 의 std15-test-db-std15 를 읽어 자동으로 만든다.
# (ESO 설치 전에 임시로 확인하고 싶다면 아래 주석의 kubectl 명령을 쓰면 된다)
#
#   kubectl -n std15-test create secret generic std15-test-db-secret \
#     --from-literal=username="$DB_USER" --from-literal=password="$DB_PASS"

apiVersion: v1
kind: Namespace
metadata:
  name: std15-test
  labels:
    name: std15-test
