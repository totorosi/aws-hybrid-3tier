# EC2 계층 - Nginx / fastAPI / MySQL 배포
#
# 이미지는 전부 ECR 에 push 한 것만 사용한다.
# 이 파일은 S3 에 올려두고, 인스턴스 userdata 가 awscli 로 내려받아 실행한다.
#
# 값은 같은 디렉터리의 .env 에서 읽는다 (.env.example 참고).

services:
  # 1. Database
  service-mysql:
    image: ${ECR_REGISTRY}/std15-test-mysql:latest
    container_name: mysql-container      # fastAPI 의 DB_HOST 와 반드시 일치
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      TZ: "Asia/Seoul"
    healthcheck:
      # 셸을 거쳐야 변수가 치환된다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - board-network

  # 2. Application
  service-fastapi:
    image: ${ECR_REGISTRY}/std15-test-fastapi:latest
    container_name: fastapi-container
    restart: unless-stopped
    environment:
      DB_HOST: mysql-container
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD:?set in .env}
    depends_on:
      service-mysql:
        condition: service_healthy       # DB 초기화가 끝난 뒤 기동
    networks:
      - board-network
    # 외부로 포트를 열지 않는다. Nginx 리버스 프록시로만 접근한다.

  # 3. Web
  service-nginx:
    image: ${ECR_REGISTRY}/std15-test-nginx:latest
    container_name: nginx-container
    restart: always
    depends_on:
      - service-fastapi
    ports:
      - "80:80"                          # 유일한 외부 노출 지점
    networks:
      - board-network

networks:
  board-network:
    driver: bridge
