# EC2 계층 - Nginx 리버스 프록시 설정
#
# 이 파일의 핵심은 "경로 변환" 이다.
#   브라우저(main.js) 가 부르는 주소 : /loadlist/items
#   fastAPI(main.py) 가 제공하는 주소 : /items
# 둘이 다르므로 Nginx 가 앞부분(/loadlist/)을 떼고 넘겨야 한다.

upstream fastapi_backend {
    # compose 의 container_name 으로 접근한다 (같은 네트워크의 DNS 이름)
    server fastapi-container:8000;
}

server {
    listen      80;
    server_name _;

    charset     utf-8;
    root        /usr/share/nginx/html;
    index       index.html;

    # ── API 리버스 프록시 ────────────────────────────────
    # proxy_pass 끝에 "/" 가 있으면 location 에 매칭된 접두사(/loadlist/)를
    # 그 "/" 로 치환한다.  ->  /loadlist/items  =>  /items
    # 이 슬래시가 없으면 /loadlist/items 가 그대로 전달돼 404 가 난다.
    location /loadlist/ {
        proxy_pass http://fastapi_backend/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── 정적 파일 ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
