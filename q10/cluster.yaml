# EKS 클러스터 (eksctl)
#
#   set -a && . ./.env && set +a
#   envsubst < cluster.yaml | eksctl create cluster -f -
#
# 핵심: 앞 단계에서 만든 기존 VPC 를 그대로 쓴다.
#       vpc.id 를 지정하지 않으면 eksctl 이 VPC 를 새로 만들어버려서
#       기존 서브넷과 태그가 전부 무용지물이 되고,
#       RDS 와 다른 네트워크가 되어 프록시에 붙지 못한다.

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: std15-test-eks
  region: ${REGION}
  version: "1.34"          # 명시해두면 재현 가능하다.
  # tags 에 Name 을 넣으면 안 된다.
  # eksctl 이 Name 태그를 자동으로 붙이기 때문에 중복되어 아래 오류로 실패한다.
  #   AWS::EKS::Cluster/ControlPlane: CREATE_FAILED
  #   "Duplicate key(s) in resource tags: [Name]"

# 향후 eksctl 릴리스에서 Auto Mode 가 기본이 된다는 경고가 뜬다.
# 현재 동작(관리형 노드그룹)을 유지하려면 명시해야 한다.
autoModeConfig:
  enabled: false

# ── 기존 VPC 재사용 ─────────────────────────────────────────
vpc:
  id: ${VPC_ID}
  subnets:
    # 퍼블릭 = Ingress 가 만들 ALB 자리.
    # 노드를 여기 두는 게 아니라 "등록"만 한다.
    # kubernetes.io/role/elb=1 태그가 미리 붙어 있어야 한다.
    public:
      ${AZ_A}: { id: ${SUBNET_PUBLIC_A} }
      ${AZ_B}: { id: ${SUBNET_PUBLIC_B} }
      ${AZ_C}: { id: ${SUBNET_PUBLIC_C} }
    # 프라이빗 = EKS 전용 서브넷. 워커노드가 여기 들어간다.
    # kubernetes.io/role/internal-elb=1 태그가 미리 붙어 있어야 한다.
    private:
      ${AZ_A}: { id: ${SUBNET_EKS_A} }
      ${AZ_B}: { id: ${SUBNET_EKS_B} }
      ${AZ_C}: { id: ${SUBNET_EKS_C} }
  clusterEndpoints:
    publicAccess: true     # 로컬에서 kubectl 가능 (노드 위치와는 무관)
    privateAccess: true    # VPC 안에서도 가능

# ── IRSA ────────────────────────────────────────────────────
# OIDC 공급자를 만들어야 ServiceAccount 에 IAM 역할을 붙일 수 있다.
# AWS Load Balancer Controller 와 External Secrets Operator 가 이걸 요구한다.
iam:
  withOIDC: true

# ── 워커노드 ────────────────────────────────────────────────
managedNodeGroups:
  - name: ng-1
    instanceType: t3.small
    amiFamily: AmazonLinux2023
    minSize: 1
    desiredCapacity: 1
    maxSize: 2
    volumeSize: 20
    volumeType: gp3
    privateNetworking: true        # 공인 IP 없음. NAT 로 ECR 이미지를 받는다.
    subnets:                       # EKS 전용 프라이빗 서브넷에만 배치
      - ${SUBNET_EKS_A}
      - ${SUBNET_EKS_B}
      - ${SUBNET_EKS_C}
    ssh:
      allow: false                 # SSM 으로 접근한다
    labels:
      role: worker
    # 노드그룹에도 Name 태그를 넣지 않는다 (같은 중복 오류).
    # eksctl 이 인스턴스에 <클러스터명>-ng-1-Node 로 자동 부여한다.
    iam:
      withAddonPolicies:
        albIngress: true
        cloudWatch: true
        ebs: true

# ── 애드온 ──────────────────────────────────────────────────
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy

# 컨트롤 플레인 로그
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "authenticator"]
    logRetentionInDays: 7
