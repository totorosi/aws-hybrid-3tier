# EKS 계층 - Nginx 리버스 프록시 (EKS 파드)
#
# 4번과 같은 경로 변환 패턴이다.
#   브라우저 : /score/init      /score/list      /score/register
#   fastAPI  : /init            /list            /register
# proxy_pass 끝의 "/" 가 /score/ 접두사를 떼어낸다.
#
# 로그는 /var/log/app 에 쓴다. 이 경로는 hostPath 볼륨이라
# 파드가 아니라 워커노드의 디스크에 남는다 (요구사항).

upstream score_backend {
    # 쿠버네티스 Service 이름. 같은 네임스페이스면 짧은 이름으로 해석된다.
    server std15-test-score-api:8000;
}

server {
    listen      80;
    server_name _;
    charset     utf-8;

    access_log  /var/log/app/nginx-access.log;
    error_log   /var/log/app/nginx-error.log warn;

    root  /usr/share/nginx/html;
    index score.html;

    # ALB 헬스체크용 — DB 를 거치지 않는 가벼운 응답
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── API 리버스 프록시 ────────────────────────────────
    # 끝의 "/" 가 핵심: /score/list => /list
    location /score/ {
        proxy_pass http://score_backend/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── 정적 파일 ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /score.html;
    }
}
