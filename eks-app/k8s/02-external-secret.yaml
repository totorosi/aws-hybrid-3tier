# EKS 계층 - External Secrets Operator 연동
#
# Secrets Manager 의 std15-test-db-std15 를 읽어
# 쿠버네티스 Secret(std15-test-db-secret)으로 자동 동기화한다.
#
# 비밀번호를 YAML 에 적지 않아도 되고, Secrets Manager 에서 값을 바꾸면
# refreshInterval 주기로 클러스터에도 반영된다.
#
# 인증은 IRSA 로 한다 — 액세스 키가 어디에도 저장되지 않는다.
#   ServiceAccount external-secrets/external-secrets
#     └─ IAM Role std15-test-eso-role
#          └─ Policy std15-test-eso-policy (GetSecretValue + kms:Decrypt)

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: std15-test-secretstore
spec:
  provider:
    aws:
      service: SecretsManager
      region: sa-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: std15-test-db-secret
  namespace: std15-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: std15-test-secretstore
    kind: ClusterSecretStore
  target:
    name: std15-test-db-secret      # 만들어질 쿠버네티스 Secret 이름
    creationPolicy: Owner
  data:
    # Secrets Manager 의 JSON {"username":"...","password":"..."} 에서
    # 키를 하나씩 꺼내 Secret 의 키로 매핑한다.
    - secretKey: username
      remoteRef:
        key: std15-test-db-std15
        property: username
    - secretKey: password
      remoteRef:
        key: std15-test-db-std15
        property: password
